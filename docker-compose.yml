# Stack de DESARROLLO. Hot reload por volumen bind. No es la configuración de producción
# (esa vive en docker-compose.prod.yml cuando llegue el despliegue).
#
# Puertos: ver DOCUMENTO_VIVO_ARQUITECTURA.md §1.2. Todo lo que maneja datos se publica
# solo en 127.0.0.1 — nunca accesible desde la red.

name: gallery

services:
  gallery_db:
    image: postgres:18-alpine
    container_name: gallery_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${DB_PORT:-5438}:5432"
    volumes:
      # Postgres 18+ espera el mount aquí, ya no en /var/lib/postgresql/data
      # (guarda los datos en un subdirectorio por versión mayor).
      - gallery_db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [gallery_network]

  gallery_redis:
    image: redis:8-alpine
    container_name: gallery_redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6383}:6379"
    volumes:
      - gallery_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 12
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [gallery_network]

  gallery_backend:
    build:
      context: ./gallery_backend
      dockerfile: Dockerfile.dev
    container_name: gallery_backend
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: development
      PORT: 3040
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3050}:3040"
    volumes:
      - ./gallery_backend:/app
      - gallery_backend_node_modules:/app/node_modules
      - gallery_storage:/app/storage
    depends_on:
      gallery_db:
        condition: service_healthy
      gallery_redis:
        condition: service_healthy
    # migrate deploy aplica las migraciones ya versionadas (prisma/migrations/).
    # La migración inicial 0_init ya está creada y commiteada — no hace falta
    # ningún `migrate dev` manual en el primer arranque.
    command: sh -c "npx prisma migrate deploy && npx prisma generate && npx ts-node prisma/seed.ts && npm run start:dev"
    networks: [gallery_network]

  gallery_frontend:
    build:
      context: ./gallery_frontend
      dockerfile: Dockerfile.dev
    container_name: gallery_frontend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_BASE_URL: http://localhost:${BACKEND_PORT:-3050}
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3051}:3041"
    volumes:
      - ./gallery_frontend:/app
      - gallery_frontend_node_modules:/app/node_modules
      # .next en un volumen para que Next no escriba (como root) en el
      # árbol montado del host — mantiene el checkout limpio.
      - gallery_frontend_next:/app/.next
    depends_on:
      - gallery_backend
    command: sh -c "npm run dev"
    networks: [gallery_network]

networks:
  gallery_network:
    driver: bridge

volumes:
  gallery_db_data:
  gallery_redis_data:
  gallery_backend_node_modules:
  gallery_frontend_node_modules:
  gallery_frontend_next:
  gallery_storage:
